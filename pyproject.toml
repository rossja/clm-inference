[project]
name = "clm-inference"
version = "0.1.0"
description = "Zero-shot CLM decisions, ranking and embeddings on Apple Silicon."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "huggingface-hub>=0.34,<2",
    "vllm @ https://github.com/vllm-project/vllm/releases/download/v0.30.0/vllm-0.30.0%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl",
    "vllm-metal @ https://github.com/vllm-project/vllm-metal/releases/download/v0.30.0/vllm_metal-0.30.0-cp312-cp312-macosx_15_0_arm64.whl",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "torch>=2.6,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
clm-inference = "clm_inference.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pylint>=3,<5", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.hatch.metadata]
allow-direct-references = true
